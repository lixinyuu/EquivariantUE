train_args:
    amp: false
    test: false
    choose_best_val_model: false
    dataset: "qm7x_ood"
    dataset_target: "dp"
    learning_rate: 0.001
    loader_te_args:
      batch_size: 10
      num_workers: 4
    loader_tr_args:
      batch_size: 10
      num_workers: 4
    loss_fn: "VectorRegressionEvidentialLoss"
    loss_fn_args: {}
    lr_schedule: true
    lr_schedule_args:
      name: linear_warmup_exponential_decay
      warmup_steps: 5
      decay_steps: 200
      decay_rate: 0.01
    n_early_stopping: 200
    n_epoch: 200
    optimizer: Adam
    optimizer_args:
      weight_decay: 1.0e-6
    seed:
    - 1
    - 10
    - 100
    - 1000
    - 10000
    ema: true
    ema_decay: 0.99
    normalizer: true
    normalizer_args:
      mean: 0.0
      std: 1.0
    kl_weight: 0.001    
    gradient_clip_val: 1.0
model_args:
    name: "PaiNNDropout22MER"
    readout: "sum"
    otf_graph: true
    use_pbc: false
    regress_forces: true
    cutoff: 5.0
    dropout_method: "bernoulli"
    dropout_p: 0.1
