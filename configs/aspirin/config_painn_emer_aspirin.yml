train_args:
    amp: false
    test: true
    choose_best_val_model: false
    dataset: aspirin_ood
    learning_rate: 0.001
    loader_te_args:
      batch_size: 10
      num_workers: 4
    loader_tr_args:
      batch_size: 10
      num_workers: 4
    loss_fn: "EnergyL1ForceEvidentialLoss"
    loss_fn_args: {"rho_force": 0.99}
    lr_schedule: true
    lr_schedule_args:
      name: linear_warmup_exponential_decay
      warmup_steps: 5
      decay_steps: 400
      decay_rate: 0.01
    n_early_stopping: 200
    n_epoch: 400
    optimizer: Adam
    optimizer_args:
      weight_decay: 1.0e-6
    seed:
    - 1
    - 10
    - 100
    ema: true
    ema_decay: 0.99
    normalizer: true
    normalizer_args:
      mean: -406750.0
      std: 1.0
    kl_weight: 0.001
    gp_trainer_args:
      learning_rate: 0.001
      n_epoch: 10
model_args:
    name: "PaiNN"
    readout: "sum"
    otf_graph: false
    use_pbc: false
    regress_forces: true
    cutoff: 5.0
    use_alpha: true
    l_dim: 2
